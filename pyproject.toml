[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiered-memory"
version = "0.1.0"
description = "Self-contained three-tier SQLite memory for OpenHands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3",
    "pydantic>=2.14",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-licenses>=4.4",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tiered_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
